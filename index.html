<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GOLF PUTT NAVI - COMPLETE V10</title>
    <style>
        body { font-family: sans-serif; margin: 0; background: #121212; color: #fff; height: 100vh; display: flex; flex-direction: column; }
        .header { padding: 15px; text-align: center; background: #1e5631; font-weight: bold; }
        .page { display: none; width: 100%; flex-grow: 1; flex-direction: column; align-items: center; }
        .page.active { display: flex; }
        .grid-channels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 20px; width: 100%; max-width: 400px; }
        .hole-btn { background: #222; border: 1px solid #444; padding: 15px; text-align: center; border-radius: 8px; cursor: pointer; }
        .hole-btn.disabled { opacity: 0.3; cursor: not-allowed; }
        #canvas-container { width: 100vw; flex-grow: 1; position: relative; touch-action: none; }
        svg { width: 100%; height: 100%; position: absolute; }
        .controls { padding: 15px; background: #222; width: 100%; max-width: 400px; border-top: 1px solid #444; }
        .result-text { color: #ffeb3b; font-weight: bold; text-align: center; margin: 10px 0; font-size: 1.1rem; line-height: 1.5; white-space: pre-line; }
    </style>
</head>
<body>
    <div class="header">GOLF PUTT NAVI</div>
    <div class="page active" id="page-home"><div class="grid-channels" id="hole-grid"></div></div>

    <div class="page" id="page-game">
        <div id="canvas-container">
            <svg id="greenSvg" viewBox="0 0 400 400">
                <image id="mapImage" width="400" height="400" />
                <g id="highlightGroup"></g>
                <line id="traceLine" stroke="#fff" stroke-width="3" stroke-dasharray="6,6" style="display:none;"/>
                <circle id="ballMarker" r="8" fill="#2196f3" style="display:none;"/>
                <circle id="pinMarker" r="8" fill="#f44336" style="display:none;"/>
            </svg>
        </div>
        <div class="controls">
            <div class="result-text" id="uiResult">ボールとピンをタップ配置</div>
            <button onclick="resetApp()" style="width: 100%; padding: 12px; margin-bottom: 5px;">リセット</button>
            <button onclick="goBackHome()" style="width: 100%; padding: 12px;">← 戻る</button>
        </div>
    </div>

    <script type="module">
        import { HOLE_DATABASES } from './data.js';
        let currentHole = null, ballPos = null, pinPos = null;
        const greenSlopeMap = {};

        // V10: IDW空間補完アルゴリズムを用いた詳細マップ構築
        function buildMapForHole(num) {
            const source = HOLE_DATABASES[num] || {};
            for(let x=0; x<=40; x++) {
                for(let y=0; y<=40; y++) {
                    let totalWeight = 0, ws = 0, wx = 0, wy = 0;
                    for (const [k, d] of Object.entries(source)) {
                        const [kx, ky] = k.split(',').map(Number);
                        const dist = Math.hypot(x-kx, y-ky) || 0.1;
                        const w = 1 / Math.pow(dist, 2);
                        ws += d.slope * w;
                        wx += Math.sin(d.angle * Math.PI/180) * w;
                        wy += Math.cos(d.angle * Math.PI/180) * w;
                        totalWeight += w;
                    }
                    const rad = Math.atan2(wx/totalWeight, wy/totalWeight);
                    greenSlopeMap[`${x},${y}`] = { slope: ws/totalWeight, angle: rad * 180/Math.PI };
                }
            }
        }

        window.selectHole = (num) => {
            currentHole = num;
            document.getElementById('mapImage').setAttribute('href', `${num}.jpg`);
            buildMapForHole(num);
            document.getElementById('page-home').classList.remove('active');
            document.getElementById('page-game').classList.add('active');
        };

        window.goBackHome = () => {
            document.getElementById('page-game').classList.remove('active');
            document.getElementById('page-home').classList.add('active');
        };

        document.getElementById('greenSvg').addEventListener('click', (e) => {
            const pt = new DOMPoint(e.clientX, e.clientY).matrixTransform(document.getElementById('greenSvg').getScreenCTM().inverse());
            if(!ballPos) { ballPos = pt; setMarker('ballMarker', pt); }
            else if(!pinPos) { pinPos = pt; setMarker('pinMarker', pt); runSim(); }
        });

        function setMarker(id, p) {
            const el = document.getElementById(id);
            el.setAttribute('cx', p.x); el.setAttribute('cy', p.y); el.style.display = 'block';
        }

        // V10: 物理シミュレーションエンジン（重力・摩擦・ベクトル蓄積）
        function runSim() {
            const dx = pinPos.x - ballPos.x, dy = pinPos.y - ballPos.y;
            const dist = Math.hypot(dx, dy);
            const angleLine = Math.atan2(dy, dx);
            let side = 0, height = 0, curX = ballPos.x, curY = ballPos.y;

            for(let i=0; i<100; i++) {
                const cell = greenSlopeMap[`${Math.floor(curX/10)},${Math.floor(curY/10)}`];
                const sRad = cell.slope * Math.PI/180;
                side += Math.sin(cell.angle * Math.PI/180 - angleLine) * Math.sin(sRad);
                height += Math.cos(cell.angle * Math.PI/180 - angleLine) * Math.sin(sRad);
                curX += Math.cos(angleLine) * (dist/100);
                curY += Math.sin(angleLine) * (dist/100);
            }
            
            document.getElementById('uiResult').innerText = 
                `カップより${side>0?'右':'左'}へ${Math.abs(side).toFixed(1)}カップ\n(${height>0?'下り':'上り'} ${Math.abs(height*200).toFixed(0)}cm相当)`;
            
            const line = document.getElementById('traceLine');
            line.setAttribute('x1', ballPos.x); line.setAttribute('y1', ballPos.y);
            line.setAttribute('x2', pinPos.x); line.setAttribute('y2', pinPos.y);
            line.style.display = 'block';
        }

        window.resetApp = () => {
            ballPos = null; pinPos = null;
            document.getElementById('ballMarker').style.display = 'none';
            document.getElementById('pinMarker').style.display = 'none';
            document.getElementById('traceLine').style.display = 'none';
            document.getElementById('uiResult').innerText = "ボールとピンをタップ配置";
        };

        const grid = document.getElementById('hole-grid');
        for(let i=1; i<=18; i++) {
            const div = document.createElement('div');
            div.className = i===14 ? 'hole-btn disabled' : 'hole-btn';
            div.innerText = i+'H';
            div.onclick = () => { if(i!==14) selectHole(i); };
            grid.appendChild(div);
        }
    </script>
</body>
</html>
