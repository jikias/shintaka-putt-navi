<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GOLF PUTT NAVI - 完全版(V10) 最終修正版</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0; padding: 0; background: #121212; color: #fff;
            display: flex; flex-direction: column; align-items: center;
            height: 100vh; overflow: hidden;
        }
        .header {
            width: 100%; padding: 12px 0; text-align: center;
            background: #1e5631; font-size: 1rem; font-weight: bold; z-index: 10;
        }
        .status-bar { padding: 6px; font-size: 0.8rem; color: #aaa; text-align: center; z-index: 10; min-height: 18px; background: #000; width: 100%; }
        
        .page { display: none; width: 100%; flex-grow: 1; flex-direction: column; align-items: center; overflow-y: auto; }
        .page.active { display: flex; }

        /* ホーム（トップ）画面 */
        .home-container { width: 100%; max-width: 400px; padding: 20px; box-sizing: border-box; }
        .section-title { font-size: 0.9rem; color: #a1c181; margin-bottom: 8px; font-weight: bold; text-transform: uppercase; }
        .setting-panel { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #333; }
        .grid-channels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 10px; }
        
        .hole-btn {
            background: #222; border: 1px solid #444; border-radius: 8px; padding: 15px 0;
            color: white; font-size: 1.1rem; font-weight: bold; cursor: pointer; text-align: center;
            transition: all 0.2s;
        }
        .hole-btn:active { background: #1e5631; border-color: #4caf50; }
        
        /* 14番ホール用の完全ロック用スタイル */
        .hole-btn.disabled { 
            opacity: 0.15 !important; 
            background: #111 !important; 
            border-color: #222 !important; 
            color: #555 !important;
            cursor: not-allowed !important; 
            pointer-events: none !important; 
        }

        /* ホール画面 */
        #canvas-container { width: 100vw; flex-grow: 1; position: relative; overflow: hidden; background: #1a1a1a; touch-action: none; }
        svg { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        image { pointer-events: none; user-select: none; -webkit-user-drag: none; }
        .highlight-cell { fill: rgba(255, 235, 59, 0.25); stroke: #ffeb3b; stroke-width: 0.4; }
        
        .controls {
            width: 100%; max-width: 400px; padding: 15px; box-sizing: border-box;
            background: rgba(30, 30, 30, 0.95); border-radius: 12px 12px 0 0; z-index: 10;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.5);
        }
        .setting-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 0.85rem; }
        select { background: #333; color: white; border: 1px solid #555; padding: 6px 12px; border-radius: 4px; font-size: 0.9rem; }
        
        .info-display { font-size: 0.85rem; color: #a1c181; text-align: center; margin-bottom: 4px; font-weight: bold; line-height: 1.4; }
        .result-text { font-size: 1.15rem; font-weight: bold; color: #ffeb3b; text-align: center; margin: 8px 0; min-height: 28px; white-space: pre-line; line-height: 1.4; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 5px; }
        .btn { flex: 1; padding: 10px; border: none; border-radius: 6px; font-size: 0.9rem; font-weight: bold; cursor: pointer; }
        .btn-reset { background: #444; color: white; }
        .btn-back { background: #c62828; color: white; }
    </style>
</head>
<body>

<div class="header" id="mainHeader">GOLF PUTT NAVI</div>
<div class="status-bar" id="statusBar">ホールを選択してください</div>

<div class="page active" id="page-home">
    <div class="home-container">
        <div class="section-title">1. 本日のグリーン環境設定</div>
        <div class="setting-panel">
            <div class="setting-row" style="margin-bottom: 12px;">
                <label for="global-stimp" style="font-weight: bold;">グリーンの速さ:</label>
                <select id="global-stimp" onchange="syncGlobalSettings()">
                    <option value="8.0">8.0 ft (重い)</option>
                    <option value="8.5">8.5 ft</option>
                    <option value="9.0">9.0 ft (普通)</option>
                    <option value="9.5">9.5 ft</option>
                    <option value="10.0" selected>10.0 ft (やや速い)</option>
                    <option value="10.5">10.5 ft</option>
                    <option value="11.0">11.0 ft (高速)</option>
                    <option value="11.5">11.5 ft</option>
                    <option value="12.0">12.0 ft (超高速)</option>
                </select>
            </div>
            <div class="setting-row" style="margin-bottom: 0;">
                <label for="global-overlap" style="font-weight: bold;">タッチの強さ:</label>
                <select id="global-overlap" onchange="syncGlobalSettings()">
                    <option value="0.1" selected>10cmオーバー (ジャストタッチ)</option>
                    <option value="0.3">30cmオーバー (しっかり強気)</option>
                </select>
            </div>
        </div>

        <div class="section-title">2. ホールを選択</div>
        <div class="grid-channels" id="hole-grid"></div>
    </div>
</div>

<div class="page" id="page-game">
    <div id="canvas-container">
        <svg id="greenSvg">
            <g id="viewport">
                <image id="mapImage" href="1.jpg" x="0" y="0" width="400" height="400" />
                <g id="highlightGroup"></g>
                <line id="traceLine" stroke="#fff" stroke-width="2.5" stroke-dasharray="4,4" style="display:none;"/>
                <circle id="ballMarker" r="8" fill="#2196f3" stroke="white" stroke-width="2.5" style="display:none;"/>
                <circle id="pinMarker" r="8" fill="#f44336" stroke="white" stroke-width="2.5" style="display:none;"/>
            </g>
        </svg>
    </div>

    <div class="controls">
        <div class="setting-row">
            <label for="stimp">速さ調整:</label>
            <select id="stimp" onchange="reCalculate()"></select> 
        </div>
        <div class="setting-row">
            <label for="overlap">タッチ調整:</label>
            <select id="overlap" onchange="reCalculate()">
                <option value="0.1">10cmオーバー (ジャストタッチ)</option>
                <option value="0.3">30cmオーバー (しっかり強気)</option>
            </select> 
        </div>
        
        <div class="info-display" id="distanceOut"></div>
        <div class="info-display" id="heightOut" style="color: #ffb74d;"></div>
        <div class="result-text" id="uiResult">画面をタップしてスタート</div>
        
        <div class="btn-group">
            <button class="btn btn-back" onclick="goBackHome()">← 戻る</button>
            <button class="btn btn-reset" onclick="resetApp()">リセット</button>
        </div>
    </div>
</div>

<script type="module">
    import { HOLE_DATABASES } from './data.js';
    window.HOLE_DATABASES = HOLE_DATABASES;

    const greenSlopeMap = {};

    function buildMapForHole(holeNum) {
        const sourceData = window.HOLE_DATABASES[holeNum] || {};
        const isDataEmpty = Object.keys(sourceData).length === 0;

        for (let x = 0; x <= 40; x++) {
            for (let y = 0; y <= 40; y++) {
                const currentKey = `${x},${y}`;
                
                if (sourceData[currentKey]) {
                    greenSlopeMap[currentKey] = sourceData[currentKey];
                    continue;
                }

                if (isDataEmpty) {
                    greenSlopeMap[currentKey] = { slope: 1.0, angle: 180 };
                    continue;
                }

                let totalWeight = 0, weightedSlopeSum = 0, weightedAngleX = 0, weightedAngleY = 0;
                for (const [knownKey, data] of Object.entries(sourceData)) {
                    const [kx, ky] = knownKey.split(',').map(Number);
                    const distance = Math.hypot(x - kx, y - ky);
                    if (distance === 0) { weightedSlopeSum = data.slope; totalWeight = 1; break; }
                    const weight = 1 / Math.pow(distance, 2);
                    weightedSlopeSum += data.slope * weight;
                    const rad = data.angle * (Math.PI / 180);
                    weightedAngleX += Math.sin(rad) * weight; weightedAngleY += Math.cos(rad) * weight;
                    totalWeight += weight;
                }
                if (totalWeight > 0) {
                    const finalSlope = weightedSlopeSum / totalWeight;
                    const finalRad = Math.atan2(weightedAngleX / totalWeight, weightedAngleY / totalWeight);
                    let finalAngle = finalRad * (180 / Math.PI);
                    if (finalAngle < 0) finalAngle += 360;
                    greenSlopeMap[currentKey] = { slope: parseFloat(finalSlope.toFixed(1)), angle: Math.round(finalAngle) };
                } else {
                    greenSlopeMap[currentKey] = { slope: 1.5, angle: 180 };
                }
            }
        }
    }

    let currentHole = null;
    let ballPos = null, pinPos = null;
    let scale = 1.0, pointX = 0, pointY = 0, startX = 0, startY = 0, isPanning = false, startDist = 0, moved = false;

    const viewport = document.getElementById('viewport');
    const container = document.getElementById('canvas-container');

    const holeGrid = document.getElementById('hole-grid');
    for (let i = 1; i <= 18; i++) {
        const btn = document.createElement('div');
        btn.className = i === 14 ? 'hole-btn disabled' : 'hole-btn';
        btn.innerText = `${i} ホール`;
        btn.onclick = function() { if(i !== 14) selectHole(i); };
        holeGrid.appendChild(btn);
    }

    window.syncGlobalSettings = function() {
        const globalSpeed = document.getElementById('global-stimp').value;
        const globalOverlap = document.getElementById('global-overlap').value;
        const localStimp = document.getElementById('stimp');
        localStimp.innerHTML = document.getElementById('global-stimp').innerHTML;
        localStimp.value = globalSpeed;
        document.getElementById('overlap').value = globalOverlap;
    }

    window.selectHole = function(num) {
        currentHole = num;
        syncGlobalSettings();
        
        document.getElementById('mapImage').setAttribute('href', `${num}.jpg`);
        buildMapForHole(num);
        
        document.getElementById('page-home').classList.remove('active');
        document.getElementById('page-game').classList.add('active');
        document.getElementById('mainHeader').innerText = `HOLE ${num} - GREEN`;
        document.getElementById('statusBar').innerText = "【2本指で拡大移動】 / 【タップして配置】";
        resetApp();
    }

    window.goBackHome = function() {
        document.getElementById('page-game').classList.remove('active');
        document.getElementById('page-home').classList.add('active');
        document.getElementById('mainHeader').innerText = "GOLF PUTT NAVI";
        document.getElementById('statusBar').innerText = "ホールを選択してください";
        currentHole = null;
    }

    window.reCalculate = function() { if (ballPos && pinPos) runPhysicalSimulation(ballPos, pinPos); }

    container.addEventListener('pointerdown', function(e) {
        moved = false;
        const touches = e.targetTouches || [e];
        if (e.pointerType === 'touch' && touches.length === 2) { 
            isPanning = false
